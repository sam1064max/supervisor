[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supervisor"
version = "0.1.0"
description = "Production-grade reference implementation of the Supervisor Pattern for multi-agent LLM systems, built on LangGraph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sushant Shambharkar", email = "sam1064max@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["langgraph", "multi-agent", "supervisor", "orchestration", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "langgraph>=0.2.0,<1.0",
    "langchain-core>=0.3.0,<1.0",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<14",
    "structlog>=24.1,<26",
]

[project.optional-dependencies]
openai = []
anthropic = []
all = []

[project.urls]
Homepage = "https://github.com/sam1064max/supervisor"
Documentation = "https://github.com/sam1064max/supervisor#readme"
Issues = "https://github.com/sam1064max/supervisor/issues"
Changelog = "https://github.com/sam1064max/supervisor/blob/main/CHANGELOG.md"

[project.scripts]
supervisor = "supervisor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/supervisor"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC", # flake8-async
    "S",    # flake8-bandit (security)
    "TID",  # flake8-tidy-imports
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # use-pathlib
    "ERA",  # eradicate commented-out code
    "PL",   # pylint
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument (used by Pydantic Field)
    "PLR0913", # too many arguments (LangGraph APIs require it)
    "PLR2004", # magic values (test code has plenty)
    "S101",  # assert in tests
    "ARG001", # unused function argument (framework callbacks)
    "ARG002", # unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "PLR2004", "ARG", "FBT"]
"src/supervisor/cli.py" = ["T201"]  # print allowed in CLI

[tool.ruff.lint.isort]
known-first-party = ["supervisor"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
mypy_path = ["src", "tests"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain.*",
    "structlog.*",
    "typer.*",
    "rich.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["src/supervisor"]
omit = [
    "src/supervisor/__main__.py",
    "src/supervisor/_version.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]
